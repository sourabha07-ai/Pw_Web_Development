 <!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Seminar Schedule</title>

    <style>
        table,
        th,
        td {
            border: 1.7px solid rgb(3, 24, 38);
            border-collapse: collapse;
        }

        th,
        td {
            padding: 7px;
        }
    </style>
</head>

<body>

    <table>

        <thead>
            <!-- First header row -->
            <tr>
                <th rowspan="3">Day</th>
                <th colspan="3">Seminar</th>
            </tr>

            <!-- Second header row -->
            <tr>
                <th colspan="2">Schedule</th>
                <th rowspan="2">Topic</th>
            </tr>

            <!-- Third header row -->
            <tr>
                <th>Begin</th>
                <th>End</th>
            </tr>
        </thead>


        <tbody>

            <!-- Monday -->
            <tr>
                <td rowspan="2">Monday</td>
                <td rowspan="2">8:00 a.m.</td>
                <td rowspan="2">5:00 p.m.</td>
                <td>Introduction to XML</td>
            </tr>

            <tr>
                <td>Validity: DTD and Relax NG</td>
            </tr>


            <!-- Tuesday -->
            <tr>
                <td rowspan="4">Tuesday</td>
                <td>8:00 a.m.</td>
                <td>11:00 a.m.</td>
                <td rowspan="2" style="padding: 15px; text-align: center;">XPath</td>
            </tr>

            <tr>
                <td rowspan="2">11:00 a.m.</td>
                <td rowspan="2">2:00 p.m.</td>
            </tr>
            <tr>
                <td rowspan="2" style="text-align: center;">XSL Transformations</td>
            </tr>

            <tr>
                <td>2:00 p.m.</td>
                <td>5:00 p.m.</td>
                
            </tr>


            <!-- Wednesday -->
            <tr>
                <td>Wednesday</td>
                <td>8:00 a.m.</td>
                <td>12:00 p.m.</td>
                <td style="text-align: center;">XSL Formatting Objects</td>
            </tr>

        </tbody>

    </table>

</body>
</html>
