
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px;font-family:Arial;background:#83d09a}
.container{width:100%;max-width:420px}
section{padding:30px;background:#fff;border-radius:12px;box-shadow:0 10px 30px #0002}
h1{text-align:center;color:#166534;margin-bottom:25px}
form{display:flex;flex-direction:column;gap:6px}
label{color:#166534;font-weight:600;margin-top:8px}
input,select,button{width:100%;padding:12px;border-radius:7px;font-size:15px}
input,select{border:1px solid #bbf7d0}
button{margin-top:10px;border:0;background:#16a34a;color:#fff;cursor:pointer}
.error{color:#dc2626;font-size:12px;min-height:16px}
.valid{border-color:#22c55e!important}
.invalid{border-color:#dc2626!important}
.summary{display:none;margin-top:20px;padding:20px;background:#fff;border-radius:12px;box-shadow:0 10px 30px #0002}
.summary h2{color:#166534;margin-bottom:12px}
.summary p{line-height:1.8}
</style>
</head>
<body>

<div class="container">

<section>
<h1>Create Account</h1>

<form id="register_form" novalidate>

<label for="username">Name</label>
<input type="text" id="username" required>
<span class="error" id="usernameError"></span>

<label for="email">Email</label>
<input type="email" id="email" required>
<span class="error" id="emailError"></span>

<label for="password">Password</label>
<input type="password" id="password" required>
<span class="error" id="passwordError"></span>

<label for="role">Role</label>
<select id="role" required>
<option value="">Select Role</option>
<option>Coder</option>
<option>Developer</option>
<option>Designer</option>
</select>
<span class="error" id="roleError"></span>

<button type="submit">Create Account</button>
</form>
</section>

<section class="summary" id="summary">
<h2>Registration Summary</h2>
<p><strong>Name:</strong> <span id="showName"></span></p>
<p><strong>Email:</strong> <span id="showEmail"></span></p>
<p><strong>Role:</strong> <span id="showRole"></span></p>
</section>

</div>

<script>
const form=document.querySelector("#register_form");
const username=document.querySelector("#username");
const email=document.querySelector("#email");
const password=document.querySelector("#password");
const role=document.querySelector("#role");

const usernameError=document.querySelector("#usernameError");
const emailError=document.querySelector("#emailError");
const passwordError=document.querySelector("#passwordError");
const roleError=document.querySelector("#roleError");

function check(input,error,valid,msg){
error.textContent=valid?"":msg;
input.classList.toggle("valid",valid);
input.classList.toggle("invalid",!valid);
return valid;
}

form.addEventListener("submit",e=>{
e.preventDefault();

const u=check(username,usernameError,username.value.trim().length>=3,"Name must be at least 3 characters");
const em=check(email,emailError,email.validity.valid&&email.value.trim()!=="","Enter a valid email");
const pw=check(password,passwordError,password.value.length>=8,"Password must be at least 8 characters");
const r=check(role,roleError,role.value!=="","Please select a role");

if(u&&em&&pw&&r){
document.querySelector("#showName").textContent=username.value;
document.querySelector("#showEmail").textContent=email.value;
document.querySelector("#showRole").textContent=role.value;
document.querySelector("#summary").style.display="block";
}
});
</script>

</body>
</html>
