<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body style="font-family: &quot;Space Mono&quot;">
    <script>
      const box = document.createElement("div");
      box.textContent = "Hello DOM";

      box.setAttribute("id", "message");
      box.setAttribute("title", "Greeting");
      box.classList.add("box", "highlight");
      document.body.appendChild(box);
    </script>
  </body>
</html>
