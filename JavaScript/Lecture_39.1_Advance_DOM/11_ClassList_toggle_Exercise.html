<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body style="font-family: &quot;Space Mono&quot;">
    <!-- Next Exercise: classList.toggle() 🔄
Now let's make the button change the appearance of the card.

Goal

When the button is clicked:

First click → add the class "active"
Second click → remove the class "active"
Third click → add it again
And so on... -->

    <script>
      const card = document.createElement("div");
      card.textContent = "Make A Card";

      const btn = document.createElement("button");
      btn.textContent = "Click";

      btn.addEventListener("click", (e) => {
        card.classList.toggle("active");
      });

      document.body.append(card, btn);
    </script>

    <style>
      .active {
        background-color: chartreuse;
        color: beige;
      }
    </style>
  </body>
</html>
